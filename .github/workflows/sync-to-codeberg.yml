name: Sync to Codeberg

on:
  push:
    branches: [ main, master ] # Change if your branch has a different name
  workflow_dispatch:
    
jobs:
  codeberg-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all branches and history

      - name: Push to Codeberg Mirror
        run: |
          # 1. Configure git with a temporary URL containing your token
          # We use your username "kJustCoding" and your saved secret token
          git remote add codeberg https://kJustCoding:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/kJustCoding/EduAnswer.git
          
          # 2. Force push all branches and tags to Codeberg
          git push codeberg --prune --force --all
          git push codeberg --prune --force --tags
